[package]
name = "wazuh-cert-oauth2-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tracing.workspace = true
rocket.workspace = true
oauth2.workspace = true
clap.workspace = true
url.workspace = true
rand_core.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
sqlx = { workspace = true, optional = true }

[dependencies.tracing-subscriber]
workspace = true
optional = true

[dependencies.openssl]
workspace = true
optional = true

[features]
# Each optional dependency is enabled via an explicit `dep:`-based feature so
# the implicit per-dependency features are not exposed publicly.
rocket = [
    "dep:tracing-subscriber"
]
openssl = [
    "dep:openssl"
]
# Enables the sqlx-backed DatabaseError variant. Only the server crate needs
# this; keeping it optional avoids dragging the Postgres driver into the
# client/webhook/healthcheck binaries.
postgres = [
    "dep:sqlx"
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
