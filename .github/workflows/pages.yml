name: Build and Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - '_config.yml'
      - 'Gemfile'
      - 'index.md'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: "0"
          persist-credentials: 'false'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@ff740bc00a01b3a50fffc55a1071b1060eeae9dc # v1.180.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Copy Helm chart repo artifacts into the site
        # Serve the chart repository (index.yaml + .tgz packages) alongside the
        # docs. chart-releaser maintains them on the `gh-pages` branch; copy them
        # into the Jekyll build output so the single Pages deploy serves both.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            for f in $(git ls-tree -r --name-only origin/gh-pages -- '*.tgz' 'index.yaml'); do
              mkdir -p "_site/$(dirname "$f")"
              git show "origin/gh-pages:${f}" > "_site/$f"
              echo "Copied $f"
            done
          else
            echo "No gh-pages branch; skipping chart artifacts"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
