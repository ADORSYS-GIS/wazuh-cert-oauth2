name: Release Client

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'crates/wazuh-cert-oauth2-client/**'
      - 'crates/wazuh-cert-oauth2-model/**'
      - 'crates/wazuh-cert-oauth2-model/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build-linux:
    name: Build CLI (Linux)
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: 'false'

      # Note: intentionally avoid caches in release build to prevent cache poisoning

      - name: Build with cross
        # The `openssl/vendored` feature flag instructs cargo to compile OpenSSL
        # from source and link it statically. This avoids the need to install
        # OpenSSL separately in the build environment, which is complex for
        # cross-compilation.
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p wazuh-cert-oauth2-client --profile prod --features openssl/vendored"

      - name: Rename resource
        env:
          TARGET: ${{ matrix.target }}
        run: mv "target/$TARGET/prod/wazuh-cert-oauth2-client" "wazuh-cert-oauth2-client-$TARGET"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wazuh-cert-oauth2-client-${{ matrix.target }}
          path: wazuh-cert-oauth2-client-${{ matrix.target }}

  build-macos:
    name: Build CLI for macOS
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            brew_prefix: /usr/local/opt/openssl@3
          - target: aarch64-apple-darwin
            runner: macos-latest
            brew_prefix: /opt/homebrew/opt/openssl@3
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: 'false'

      # Note: intentionally avoid caches in release build to prevent cache poisoning

      - name: Install OpenSSL and pkg-config
        run: |
          brew update
          brew install pkg-config openssl@3

      - name: Build with cross
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p wazuh-cert-oauth2-client --profile prod"
        env:
          PKG_CONFIG_PATH: ${{ matrix.brew_prefix }}/lib/pkgconfig
          OPENSSL_NO_VENDOR: "1"

      - name: Rename resource
        env:
          TARGET: ${{ matrix.target }}
        run: mv "target/$TARGET/prod/wazuh-cert-oauth2-client" "wazuh-cert-oauth2-client-$TARGET"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wazuh-cert-oauth2-client-${{ matrix.target }}
          path: wazuh-cert-oauth2-client-${{ matrix.target }}

  build-windows:
    name: Build CLI for Windows
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: 'false'

      # Note: intentionally avoid caches in release build to prevent cache poisoning

      - name: Build with cross
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p wazuh-cert-oauth2-client --profile prod --features openssl/vendored"

      - name: Rename resource
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: Move-Item -Path "target/$env:TARGET/prod/wazuh-cert-oauth2-client.exe" -Destination "wazuh-cert-oauth2-client-$env:TARGET.exe"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wazuh-cert-oauth2-client-${{ matrix.target }}
          path: wazuh-cert-oauth2-client-${{ matrix.target }}.exe

  update-changelog-and-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs:
      - build-linux
      - build-macos
      - build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: 'false'

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ./target

      - name: Configure git user
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Generate checksums
        run: |
          # Calculate binary checksums and strip directory prefix
          find target -type f -exec sha256sum {} + | sed 's|  target/[^/]*/|  |' > checksums.sha256
          # Calculate script checksums and keep paths
          find scripts -type f -exec sha256sum {} + >> checksums.sha256
          cat checksums.sha256

      - name: Generate full CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit and push changes
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add CHANGELOG.md checksums.sha256
          git commit -m "docs: update CHANGELOG.md and checksums [skip ci]"
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            BRANCH="bot/update-checksums-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "docs: update CHANGELOG.md and checksums" \
              --body "Automated update of CHANGELOG.md and checksums.sha256"
          else
            git push origin "$TARGET_BRANCH"
          fi

      - name: Upload Checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checksums.sha256
          path: checksums.sha256

  release:
    name: Release
    permissions:
      contents: write
    needs:
      - update-changelog-and-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          ref: ${{ github.ref }}
          persist-credentials: 'false'

      - name: Get the version
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ./target

      - name: Generate checksums
        run: |
          # Calculate binary checksums and strip directory prefix
          find target -type f -exec sha256sum {} + | sed 's|  target/[^/]*/|  |' > checksums.sha256
          # Calculate script checksums and keep paths
          find scripts -type f -exec sha256sum {} + >> checksums.sha256
          cat checksums.sha256

      - name: Generate release notes (latest only)
        id: git_cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: /tmp/release-notes.md

      - name: Determine prerelease
        id: prerelease
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == *"rc"* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          PRERELEASE: ${{ steps.prerelease.outputs.PRERELEASE }}
          RELEASE_NOTES: ${{ steps.git_cliff.outputs.content }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          ASSETS+(./target/**/*)
          ASSETS+=(./checksums.sha256)
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$VERSION" "${ASSETS[@]}" \
              --title "Release $VERSION" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$VERSION" "${ASSETS[@]}" \
              --title "Release $VERSION" \
              --notes-file /tmp/release-notes.md
          fi
