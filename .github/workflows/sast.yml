name: Static Application Security Testing (SAST)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'checksums.sha256'
      - '.vscode/**'
      - 'LICENSE'
      - '_includes/**'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cliff.toml'
      - 'Makefile.docs'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'checksums.sha256'
      - '.vscode/**'
      - 'LICENSE'
      - '_includes/**'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cliff.toml'
      - 'Makefile.docs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sbom.yml@17fe8c106fcac2a4b6ac1992cd1b89166f0eb5e2
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read

  # Detect which language areas changed so each scanner only runs on the code
  # it targets (e.g. a scripts-only change should not trigger the Rust scan).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter queries the GitHub API on pull_request events
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      shell: ${{ steps.filter.outputs.shell }}
      powershell: ${{ steps.filter.outputs.powershell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: 'false'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            shell:
              - 'scripts/**/*.sh'
            powershell:
              - 'scripts/**/*.ps1'

  sast-rust:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-rust.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
      rust-version: "stable"
    permissions:
      contents: read
      actions: read
      checks: write

  sast-shell:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.shell == 'true') }}
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-shell.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  sast-powershell:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.powershell == 'true') }}
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-powershell.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  secret-scan:
    name: Secret Scan (Gitleaks)
    # Shared secret scanning workflow from adorsys-ci-cd-templates: scans the
    # full git history (--log-opts=--all) and notifies the SIEM webhook on
    # findings. Pinned to a commit SHA for supply-chain safety.
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/secret-scan.yml@db2f1dbe7eb5efbcb06aa80ad3719fc1675c37bf
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
    secrets:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
